[package]
name        = "um-parttable-abi"
version     = "0.1.0"
edition      = "2024"
rust-version = "1.92"
license     = "Apache-2.0"
description = "Crux OS partition-table service IPC protocol -- shared between um-parttable and clients that need to find their own partition (e.g. um-cfs)."

[lib]
name = "um_parttable_abi"
path = "lib.rs"

[dependencies]
zigbone-abi = { git = "https://github.com/crux-os/zigbone-abi.git" }
