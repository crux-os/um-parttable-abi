[package]
name        = "um-parttable-abi"
version     = "0.1.0"
edition      = "2024"
rust-version = "1.92"
license     = "Apache-2.0"
description = "Crux OS partition-table service: protocol and client (finding partitions, partitioning a disk through a handle opened for writing)."

[lib]
name = "um_parttable_abi"
path = "lib.rs"

[dependencies]
zigbone-abi = { git = "https://github.com/crux-os/zigbone-abi.git" }
runtime     = { git = "https://github.com/crux-os/rustspace.git", package = "runtime" }
